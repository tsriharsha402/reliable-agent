name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Harness tests
        run: pytest
      - name: Scripted demo
        run: |
          python -m reliable_agent demo > demo.txt
          cat demo.txt
          { echo '```'; cat demo.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
